# Top-level key is the main source document.
# Nested `file` values identify include-origin nodes whose source is not the main file.
install.adoc: # Actual source filename
  title: Install the Application # doctitle
  lines: 280 # length of main file
  attributes_custom: # included by default; built-in attrs filtered out
    page-role: how-to
    # repeats for all user-defined attributes
  attributes_builtin: # omitted by default; include explicitly in requested output
    doctitle: Install the Application

  sections_tree: # nested representation; when form includes `tree` (default)
    - id: _prerequisites # nullable; excludes inferred autogenerated IDs
      # file: <path> # include-sourced only
      text: Required Dependencies
      level: 1
      starts_at: 98
      ends_near: 160
      sections: # empty [] if no nested sections
        - id: macos-prerequisites
          file: macos-prerequisites.adoc
          text: MacOS
          level: 2
          starts_at: 10
          ends_near: 60
          sections:
            - id: macos-homebrew
              file: macos-prerequisites.adoc
              text: Homebrew Installation
              level: 3
              starts_at: 14
              ends_near: 56
              sections: []
              # repeats to level 5 if applicable

  sections_flat: # when form includes `flat`
    - id: _prerequisites
      # file: <path> # include-sourced only
      text: Required Dependencies
      level: 1
      starts_at: 98
      ends_near: 160
      parent_id: null # nullable; root sections have no parent
      sections:
        - macos-prerequisites
        - windows-prerequisites
        - linux-prerequisites

  definition_lists:
    - id: null # or <anchor-id> when available
      title: null # or <block title>
      # file: <path> # include-sourced only
      role: qanda # only when role is set
      starts_at: 141
      section_id: _prerequisites # containing section anchor-id, or null before first section
      definition_terms: # first tier only; no nested DLs
        - text: some term or phrase or quasi-title
          starts_at: 142
        # repeats for first-tier terms

  code_blocks: # titled blocks only
    - id: null # or <anchor-id> when available
      title: Example package.json addition
      file: macos-prerequisites.adoc
      starts_at: 30
      language: json # source blocks only
      section_id: macos-node
      includes: # transcluded sources referenced by this block
        - "include::path/to/file.ext[]"
        - "include::path/to/other.ext[lines=1..5]"

  literal_blocks:
    - id: install-command-template # or null
      title: Example install command series
      # file: <path> # include-sourced only
      starts_at: 180
      section_id: _bootstrap
      includes: []

  examples: # titled examples only
    - id: sample-output # or null
      title: Sample install command output
      # file: <path> # include-sourced only
      starts_at: 188
      section_id: _bootstrap
      includes: []

  sidebars: # titled sidebars only
    - id: sidebar-docker # or null
      title: Using Docker to bootstrap your experience
      # file: <path> # include-sourced only
      starts_at: 210
      section_id: _alternative-installs
      includes:
        - "include::path/to/asides/docker.adoc[]"

  tables: # only tables with titles or headers
    - id: null # or <anchor-id> when available
      title: Comparison of Installation Methods # or null
      # file: <path> # include-sourced only
      starts_at: 220
      headers:
        - Installation Method
        - Feature
      section_id: _alternative-installs

  admonitions: # titled admonitions only; not included by default
    - id: null # or <anchor-id> when available
      type: NOTE # or TIP|IMPORTANT|WARNING|CAUTION
      title: Unusual but possible, an admonition title
      # file: <path> # include-sourced only
      starts_at: 10
      section_id: null # elements before the first level-1 section

  quotes: # titled quotes only; not included by default
    - id: null # or <anchor-id> when available
      title: A summary for this quote
      # file: <path> # include-sourced only
      starts_at: 240
      attribution: DocOps Lab # author/source when available
      section_id: _conclusion

  images:
    - id: null # or <anchor-id>
      title: Look at the silly graph # figure caption
      # file: <path> # include-sourced only
      target: images/silly-graph.png
      alt: A graph showing something unimportant and goofy
      starts_at: 180
      section_id: important-figures
# Pattern repeats for each source document in a flat mapping of
#  source path to its extracted content and metadata.